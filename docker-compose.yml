services:
  webserver:
    build: .
    ports:
      - "8000:8000"
    restart: always
    env_file:
      - path: ./app/.env   # only used to seed data/config.json on first start
        required: false
    volumes:
      - alwayshue-data:/app/data   # config.json + app.log survive rebuilds
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  alwayshue-data:
